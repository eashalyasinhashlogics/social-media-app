<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOMO - Verify Email</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Header Logo Section */
        .brand-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
        }

        .brand-icon {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: #ffffff;
            font-size: 22px;
            font-weight: 700;
            width: 44px;
            height: 44px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.4);
        }

        .brand-name {
            font-size: 26px;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.5px;
        }

        /* Main Card Container */
        .verification-card {
            background-color: #ffffff;
            border-radius: 20px;
            width: 100%;
            max-width: 490px;
            padding: 40px;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.03);
            position: relative;
        }

        /* Back Navigation */
        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #64748b;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 28px;
            cursor: pointer;
        }

        /* Envelope Icon */
        .icon-container {
            width: 60px;
            height: 60px;
            background-color: #e0e7ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }

        .icon-container svg {
            width: 26px;
            height: 26px;
            color: #4f46e5;
        }

        /* Typography */
        h2 {
            font-size: 26px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 10px;
            letter-spacing: -0.3px;
        }

        .instruction-text {
            font-size: 15px;
            color: #64748b;
            margin-bottom: 32px;
            font-weight: 400;
        }

        .instruction-text strong {
            color: #0f172a;
            font-weight: 600;
        }

        /* Code Input Area */
        .code-activation-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-bottom: 36px;
        }

        .inputs-wrapper {
            display: flex;
            justify-content: space-between;
            width: 100%;
            gap: 10px;
        }

        .code-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .code-input {
            width: 100%;
            height: 64px;
            border: 1.5px solid #e2e8f0;
            border-radius: 14px;
            font-size: 24px;
            font-weight: 600;
            text-align: center;
            color: #0f172a;
            outline: none;
            background-color: transparent;
            transition: all 0.2s ease;
        }

        /* Active highlight styling matching the first box */
        .code-box.active .code-input, 
        .code-input:focus {
            border-color: #4f46e5;
            border-width: 2px;
            box-shadow: 0 0 0 0.5px #4f46e5;
        }

        /* Indicator Dashes */
        .dash-line {
            width: 24px;
            height: 2px;
            background-color: #cbd5e1;
            border-radius: 2px;
        }

        /* Footer Info Section */
        .footer-text {
            font-size: 14px;
            color: #64748b;
            text-align: center;
            margin-bottom: 12px;
        }

        .resend-countdown {
            color: #94a3b8;
            font-weight: 500;
        }

        .expiration-warning {
            font-size: 12px;
            color: #94a3b8;
            text-align: center;
            font-weight: 400;
        }
    </style>
</head>
<body>

    <div class="brand-header">
        <div class="brand-icon">F</div>
        <span class="brand-name">FOMO</span>
    </div>

    <div class="verification-card">
        
        <a class="back-button" href="#">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Back
        </a>

        <div class="icon-container">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
        </div>

        <h2>Verify your email</h2>
        <p class="instruction-text">We sent a 6-digit code to <strong>you@example.com</strong></p>

        <div class="code-activation-container">
            <div class="inputs-wrapper">
                <div class="code-box active">
                    <input type="text" class="code-input" maxlength="1" autofocus>
                    <div class="dash-line"></div>
                </div>
                <div class="code-box">
                    <input type="text" class="code-input" maxlength="1">
                    <div class="dash-line"></div>
                </div>
                <div class="code-box">
                    <input type="text" class="code-input" maxlength="1">
                    <div class="dash-line"></div>
                </div>
                <div class="code-box">
                    <input type="text" class="code-input" maxlength="1">
                    <div class="dash-line"></div>
                </div>
                <div class="code-box">
                    <input type="text" class="code-input" maxlength="1">
                    <div class="dash-line"></div>
                </div>
                <div class="code-box">
                    <input type="text" class="code-input" maxlength="1">
                    <div class="dash-line"></div>
                </div>
            </div>
        </div>

        <p class="footer-text">Didn't receive the code? <span class="resend-countdown">Resend in 27s</span></p>
        <p class="expiration-warning">Code expires in 15 minutes</p>
        
    </div>

</body>
</html>
