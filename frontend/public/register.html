<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FOMO - Create Account</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4 font-sans text-slate-800">

  <div class="flex items-center space-x-3 mb-8">
    <div class="w-10 h-10 bg-indigo-500 rounded-full flex items-center justify-center text-white font-bold text-xl shadow-sm">
      F
    </div>
    <span class="font-extrabold text-2xl tracking-tight">FOMO</span>
  </div>

  <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-8 w-full max-w-md">
    
    <h1 class="text-2xl font-bold mb-1">Create account</h1>
    <p class="text-slate-500 text-sm mb-6">Join millions connecting authentically</p>

    <div class="flex gap-4 mb-6">
      <button class="flex-1 py-2 px-4 border border-slate-200 rounded-xl text-sm font-semibold hover:bg-slate-50 transition-colors">
        Google
      </button>
      <button class="flex-1 py-2 px-4 border border-slate-200 rounded-xl text-sm font-semibold hover:bg-slate-50 transition-colors">
        GitHub
      </button>
    </div>

    <div class="flex items-center mb-6">
      <div class="flex-grow h-px bg-slate-100"></div>
      <span class="px-4 text-slate-400 text-xs font-medium">or with email</span>
      <div class="flex-grow h-px bg-slate-100"></div>
    </div>

    <form class="space-y-4" onsubmit="event.preventDefault();">
      
      <div>
        <label class="block text-sm font-bold text-slate-800 mb-1.5">Full name</label>
        <input type="text" placeholder="Alex Rivera" class="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-100 focus:border-indigo-400 transition-all">
      </div>

      <div>
        <label class="block text-sm font-bold text-slate-800 mb-1.5">Email address</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
            <svg class="h-4 w-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
            </svg>
          </div>
          <input type="email" placeholder="you@example.com" class="w-full border border-slate-200 rounded-xl pl-10 pr-4 py-2.5 text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-100 focus:border-indigo-400 transition-all">
        </div>
      </div>

      <div>
        <label class="block text-sm font-bold text-slate-800 mb-1.5">Password</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
            <svg class="h-4 w-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
          </div>
          <input type="password" placeholder="Min. 8 characters" class="w-full border border-slate-200 rounded-xl pl-10 pr-10 py-2.5 text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-100 focus:border-indigo-400 transition-all">
          <div class="absolute inset-y-0 right-0 pr-3.5 flex items-center cursor-pointer">
            <svg class="h-4 w-4 text-slate-400 hover:text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          </div>
        </div>
      </div>

      <div>
        <label class="block text-sm font-bold text-slate-800 mb-1.5">Confirm password</label>
        <input type="password" placeholder="Repeat password" class="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-100 focus:border-indigo-400 transition-all">
      </div>

      <button type="submit" class="w-full bg-indigo-300 text-white rounded-xl py-3 font-semibold mt-4 hover:bg-indigo-400 transition-colors shadow-sm">
        Create account
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-slate-500">
      Already have an account? <a href="#" class="text-indigo-600 font-bold hover:underline">Log in</a>
    </p>

  </div>
</body>
</html>
