<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOMO - Splash Screen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body, html {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Vibrant diagonal gradient matching the background */
            background: linear-gradient(135deg, #6c3bfb 0%, #583fe1 45%, #00b0df 100%);
            overflow: hidden;
        }

        .splash-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            color: #ffffff;
        }

        /* Glassmorphism Icon Styling */
        .logo-box {
            width: 110px;
            height: 110px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            margin-bottom: 24px;
        }

        .logo-letter {
            font-size: 3.2rem;
            font-weight: 800;
            color: #ffffff;
        }

        /* Typography */
        .app-title {
            font-size: 3.2rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            line-height: 1;
            margin-bottom: 8px;
        }

        .app-tagline {
            font-size: 1.15rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 0.2px;
            margin-bottom: 48px;
        }

        /* Progress Bar Track */
        .progress-container {
            width: 220px;
            height: 6px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 100px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        /* Animated Progress Bar */
        .progress-bar {
            height: 100%;
            background: #ffffff;
            border-radius: 100px;
            /* Added smooth keyframe animation */
            animation: loadProgress 2.5s ease-in-out infinite;
        }

        /* Status Label */
        .status-text {
            font-size: 0.85rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.55);
            letter-spacing: 0.1px;
        }

        /* Loading Animation Definition */
        @keyframes loadProgress {
            0% {
                width: 0%;
            }
            80% {
                width: 100%;
            }
            100% {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="splash-container">
        <div class="logo-box">
            <span class="logo-letter">F</span>
        </div>

        <h1 class="app-title">FOMO</h1>
        <p class="app-tagline">Authentic Connections</p>

        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>
        <p class="status-text">Building your social space...</p>
    </div>

</body>
</html>
