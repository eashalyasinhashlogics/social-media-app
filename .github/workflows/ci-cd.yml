name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip build+test and redeploy the image already in GHCR (fast deploy-loop iteration)"
        type: boolean
        default: false

# Two ways to skip the ~11-minute build+test pass while iterating on the deploy
# step itself:
#
#   1. Actions -> Run workflow -> tick "skip_tests"   (no push needed)
#   2. Put [skip tests] in the commit message         (works on a normal push)
#
# Both deploy whatever :latest already points at in GHCR, so neither publishes a
# new image — change application code and you need one full run before a skipped
# one means anything. Deliberately NOT GitHub's built-in [skip ci], which
# cancels the whole run including the deploy.

env:
  REGISTRY: ghcr.io

# Deploys must not overlap. Queue a second push behind the first rather than
# cancelling it — a half-finished deploy is worse than a slow one.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build & smoke-test backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      # Added: GitHub-hosted runners can hit memory pressure during heavy
      # operations (alembic's autogenerate-style diff in particular). Swap
      # gives the kernel headroom instead of SIGKILLing the process (exit 137).
      #
      # ubuntu-latest images already ship with a swapfile active at boot, so
      # blindly fallocate-ing /swapfile fails with "Text file busy" (the
      # kernel has that file mapped as live swap). That also means "is any
      # swap on?" is always true here, so the old check-then-skip version of
      # this step always took the "already active" branch and never actually
      # added anything on top of the stock swap. Instead, top up to a fixed
      # TOTAL using a separate file, so we always get real extra headroom no
      # matter what the runner starts with.
      - name: Ensure swap space
        if: ${{ inputs.skip_tests != true && !contains(github.event.head_commit.message, '[skip tests]') }}
        run: |
          echo "Swap before:"; free -h; sudo swapon --show
          TARGET_SWAP_MB=8192
          CURRENT_SWAP_MB=$(free -m | awk '/^Swap:/{print $2}')
          echo "Current swap: ${CURRENT_SWAP_MB}MB, target: ${TARGET_SWAP_MB}MB"
          if [ "$CURRENT_SWAP_MB" -ge "$TARGET_SWAP_MB" ]; then
            echo "Swap already sufficient — leaving it as is."
          else
            NEED_MB=$(( TARGET_SWAP_MB - CURRENT_SWAP_MB ))
            SWAPFILE=/mnt/swapfile-ci
            echo "Topping up by ${NEED_MB}MB at $SWAPFILE..."
            sudo fallocate -l "${NEED_MB}M" "$SWAPFILE" 2>/dev/null || \
              sudo dd if=/dev/zero of="$SWAPFILE" bs=1M count="$NEED_MB"
            sudo chmod 600 "$SWAPFILE"
            sudo mkswap "$SWAPFILE"
            sudo swapon "$SWAPFILE"
          fi
          echo "Swap after:"; free -h; sudo swapon --show

      - name: Resolve image name
        id: image
        run: |
          echo "name=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-backend" >> "$GITHUB_OUTPUT"

      - name: Write a throwaway .env for the test stack
        if: ${{ inputs.skip_tests != true && !contains(github.event.head_commit.message, '[skip tests]') }}
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=ci
          POSTGRES_PASSWORD=ci-test-password
          POSTGRES_DB=social_media_ci
          SECRET_KEY=ci-test-secret-key
          DEBUG=False
          EOF

      - name: Build image
        if: ${{ inputs.skip_tests != true && !contains(github.event.head_commit.message, '[skip tests]') }}
        run: docker compose build app

      - name: Start stack
        if: ${{ inputs.skip_tests != true && !contains(github.event.head_commit.message, '[skip tests]') }}
        run: docker compose up -d --wait --wait-timeout 180

      # Split into two steps (was one combined step) so a failure tells you
      # exactly which command died, instead of both being lumped together.
      - name: Assert alembic is at head
        if: ${{ inputs.skip_tests != true && !contains(github.event.head_commit.message, '[skip tests]') }}
        run: docker compose exec -T app alembic current

      - name: Assert no model/migration drift
        if: ${{ inputs.skip_tests != true && !contains(github.event.head_commit.message, '[skip tests]') }}
        run: docker compose exec -T app alembic check

      # Added: if it dies again, this tells you whether it was really memory
      # (near-zero available RAM right before the kill) or something else.
      - name: Diagnose resource usage on failure
        if: failure()
        run: |
          free -h
          df -h
          docker stats --no-stream

      - name: Assert API responds
        if: ${{ inputs.skip_tests != true && !contains(github.event.head_commit.message, '[skip tests]') }}
        run: |
          curl -fsS http://127.0.0.1:8000/ | grep -q "Welcome to Social Media API"
          curl -fsS http://127.0.0.1:8000/health | grep -q '"status":"ok"'
          curl -fsS -o /dev/null http://127.0.0.1:8000/docs

      - name: Run the backend test suite (exercises auth, admin, etc.)
        if: ${{ inputs.skip_tests != true && !contains(github.event.head_commit.message, '[skip tests]') }}
        run: |
          docker compose exec -T \
            -e TEST_DATABASE_URL="postgresql://ci:ci-test-password@postgres:5432/social_media_ci_test" \
            app pytest tests/ -v --cov=app

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: ${{ always() && inputs.skip_tests != true && !contains(github.event.head_commit.message, '[skip tests]') }}
        run: docker compose down -v

      # --- publish (main only; PRs stop at the smoke test) ---

      - name: Log in to GHCR
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && inputs.skip_tests != true && !contains(github.event.head_commit.message, '[skip tests]') }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag & push
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && inputs.skip_tests != true && !contains(github.event.head_commit.message, '[skip tests]') }}
        run: |
          IMAGE="${{ steps.image.outputs.name }}"
          docker tag social-media-api:latest "$IMAGE:${{ github.sha }}"
          docker tag social-media-api:latest "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  deploy:
    name: Deploy to EC2
    needs: build-and-test
    # Pull requests never deploy — they stop after build-and-test.
    # workflow_dispatch is included so "Run workflow" can redeploy main without
    # a code change (after fixing a secret, say). Publish is gated on the same
    # condition, so a dispatched run refreshes the image it then deploys.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ship compose files to the instance
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy "$EC2_USER@$EC2_HOST" "mkdir -p '$DEPLOY_PATH'"
          # Only the compose files. Phase 3 adds backend/scripts and
          # backend/deploy (nginx config + TLS setup) and restores the
          # rm -rf / chmod +x handling those directories need.
          #
          # docker-compose.prod.yml is shipped now even though Phase 2 does not
          # use it, so it is already in place when Phase 3 switches over.
          scp -i ~/.ssh/id_deploy \
            backend/docker-compose.yml backend/docker-compose.prod.yml \
            "$EC2_USER@$EC2_HOST:$DEPLOY_PATH/"

      - name: Deploy over SSH
        env:
          IMAGE: ${{ needs.build-and-test.outputs.image }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes \
              "$EC2_USER@$EC2_HOST" 'bash -s' <<EOF
          set -euo pipefail

          # cd, not just a existence test: an empty or wrong EC2_DEPLOY_PATH
          # would otherwise leave us in the SSH login directory silently
          # ("cd \"\"" is a successful no-op in bash).
          cd "$DEPLOY_PATH" || { echo "ERROR: cannot cd to the deploy path." >&2; exit 1; }

          if [ ! -f .env ]; then
            # The path is masked in the log because it is a secret, which makes
            # a bare failure impossible to diagnose. Dump where we actually
            # landed and where .env really lives — neither is masked.
            echo "ERROR: .env is missing in the deploy path." >&2
            echo "--- landed in ---" >&2
            pwd >&2
            echo "--- contents ---" >&2
            ls -la >&2
            echo "--- .env files under /home/ubuntu ---" >&2
            find /home/ubuntu -maxdepth 4 -name .env -not -path '*/node_modules/*' 2>/dev/null >&2
            echo "Set EC2_DEPLOY_PATH to the directory listed above." >&2
            exit 1
          fi

          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

          export DOCKER_IMAGE="$IMAGE:latest"

          # Base file only in Phase 2, so the app stays published on
          # 0.0.0.0:8000 and remains reachable while there is no nginx in
          # front of it. Phase 3 adds -f docker-compose.prod.yml, which moves
          # it to 127.0.0.1 and hands the public port to nginx.
          #
          # --no-build because the base file still carries a build: section
          # and DEPLOY_PATH has no Dockerfile — without it a failed pull
          # silently degrades into an attempted build instead of failing.
          docker compose pull app
          docker compose up -d --no-build
          docker image prune -f

          docker logout ghcr.io
          EOF

      # Checked over SSH against loopback rather than over the public internet:
      # the security group does not need port 8000 opened to GitHub's rotating
      # runner IPs, and this step keeps working unchanged when Phase 3 moves
      # the app behind nginx and closes 8000 entirely.
      - name: Verify the deployed API is healthy
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes \
              "$EC2_USER@$EC2_HOST" 'bash -s' <<EOF
          set -euo pipefail
          cd "$DEPLOY_PATH"

          for i in \$(seq 1 20); do
            if curl -fsS -m 5 http://127.0.0.1:8000/health | grep -q '"status":"ok"'; then
              echo "Deployed API is healthy."
              # Migrations are the likeliest silent failure: the container can
              # answer /health perfectly well while sitting on a stale schema,
              # so assert head rather than just printing the revision.
              if ! docker compose exec -T app alembic current 2>/dev/null | grep -q '(head)'; then
                echo "ERROR: alembic is not at head after deploy." >&2
                docker compose exec -T app alembic current
                exit 1
              fi
              echo "Migrations are at head."
              exit 0
            fi
            echo "waiting for API... (\$i/20)"; sleep 5
          done

          echo "API did not become healthy after deploy." >&2
          docker compose ps
          docker compose logs --tail 50 app
          exit 1
          EOF
