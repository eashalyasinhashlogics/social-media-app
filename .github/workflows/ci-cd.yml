name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Public hostname the API is served on. Not a secret — it is also hardcoded
  # in backend/deploy/nginx/social-app.conf, which is committed.
  API_URL: https://socialappfomo.duckdns.org
  API_DOMAIN: socialappfomo.duckdns.org

# Deploys must not overlap. Queue a second push behind the first rather than
# cancelling it — a half-finished deploy is worse than a slow one.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build & smoke-test backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      # Added: GitHub-hosted runners can hit memory pressure during heavy
      # operations (alembic's autogenerate-style diff in particular). Swap
      # gives the kernel headroom instead of SIGKILLing the process (exit 137).
      #
      # ubuntu-latest images already ship with a swapfile active at boot, so
      # blindly fallocate-ing /swapfile fails with "Text file busy" (the
      # kernel has that file mapped as live swap). That also means "is any
      # swap on?" is always true here, so the old check-then-skip version of
      # this step always took the "already active" branch and never actually
      # added anything on top of the stock swap. Instead, top up to a fixed
      # TOTAL using a separate file, so we always get real extra headroom no
      # matter what the runner starts with.
      - name: Ensure swap space
        run: |
          echo "Swap before:"; free -h; sudo swapon --show
          TARGET_SWAP_MB=8192
          CURRENT_SWAP_MB=$(free -m | awk '/^Swap:/{print $2}')
          echo "Current swap: ${CURRENT_SWAP_MB}MB, target: ${TARGET_SWAP_MB}MB"
          if [ "$CURRENT_SWAP_MB" -ge "$TARGET_SWAP_MB" ]; then
            echo "Swap already sufficient — leaving it as is."
          else
            NEED_MB=$(( TARGET_SWAP_MB - CURRENT_SWAP_MB ))
            SWAPFILE=/mnt/swapfile-ci
            echo "Topping up by ${NEED_MB}MB at $SWAPFILE..."
            sudo fallocate -l "${NEED_MB}M" "$SWAPFILE" 2>/dev/null || \
              sudo dd if=/dev/zero of="$SWAPFILE" bs=1M count="$NEED_MB"
            sudo chmod 600 "$SWAPFILE"
            sudo mkswap "$SWAPFILE"
            sudo swapon "$SWAPFILE"
          fi
          echo "Swap after:"; free -h; sudo swapon --show

      - name: Resolve image name
        id: image
        run: |
          echo "name=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-backend" >> "$GITHUB_OUTPUT"

      - name: Write a throwaway .env for the test stack
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=ci
          POSTGRES_PASSWORD=ci-test-password
          POSTGRES_DB=social_media_ci
          SECRET_KEY=ci-test-secret-key
          DEBUG=False
          EOF

      - name: Build image
        run: docker compose build app

      - name: Start stack
        run: docker compose up -d --wait --wait-timeout 180

      # Split into two steps (was one combined step) so a failure tells you
      # exactly which command died, instead of both being lumped together.
      - name: Assert alembic is at head
        run: docker compose exec -T app alembic current

      - name: Assert no model/migration drift
        run: docker compose exec -T app alembic check

      # Added: if it dies again, this tells you whether it was really memory
      # (near-zero available RAM right before the kill) or something else.
      - name: Diagnose resource usage on failure
        if: failure()
        run: |
          free -h
          df -h
          docker stats --no-stream

      - name: Assert API responds
        run: |
          curl -fsS http://127.0.0.1:8000/ | grep -q "Welcome to Social Media API"
          curl -fsS http://127.0.0.1:8000/health | grep -q '"status":"ok"'
          curl -fsS -o /dev/null http://127.0.0.1:8000/docs

      - name: Run the backend test suite (exercises auth, admin, etc.)
        run: |
          docker compose exec -T \
            -e TEST_DATABASE_URL="postgresql://ci:ci-test-password@postgres:5432/social_media_ci_test" \
            app pytest tests/ -v --cov=app

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

      # --- publish (main only; PRs stop at the smoke test) ---

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag & push
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          IMAGE="${{ steps.image.outputs.name }}"
          docker tag social-media-api:latest "$IMAGE:${{ github.sha }}"
          docker tag social-media-api:latest "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  deploy:
    name: Deploy to EC2
    needs: build-and-test
    # Pull requests never deploy — they stop after build-and-test.
    # workflow_dispatch is included so "Run workflow" can redeploy main without
    # a code change (after fixing a secret, say). Publish is gated on the same
    # condition, so a dispatched run refreshes the image it then deploys.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ship compose files to the instance
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          # Clear these two first rather than copying over them: a recursive
          # copy merges, so a file deleted from the repo would linger on the
          # instance. Removing them makes the deployed tree match the commit.
          ssh -i ~/.ssh/id_deploy "$EC2_USER@$EC2_HOST" \
            "mkdir -p '$DEPLOY_PATH' && rm -rf '$DEPLOY_PATH/scripts' '$DEPLOY_PATH/deploy'"
          # scripts/ and deploy/ are shipped so the TLS setup is on the box when
          # it is needed. Note this only touches $DEPLOY_PATH — the LIVE nginx
          # config at /etc/nginx/sites-available/social-app is never written by
          # CI, because certbot rewrites that file to add the TLS block and
          # overwriting it here would break HTTPS on every deploy.
          scp -r -i ~/.ssh/id_deploy \
            backend/docker-compose.yml backend/docker-compose.prod.yml \
            backend/scripts backend/deploy \
            "$EC2_USER@$EC2_HOST:$DEPLOY_PATH/"
          # scp does not reliably carry the executable bit across versions.
          ssh -i ~/.ssh/id_deploy "$EC2_USER@$EC2_HOST" \
            "chmod +x '$DEPLOY_PATH'/scripts/*.sh"

      - name: Deploy over SSH
        env:
          IMAGE: ${{ needs.build-and-test.outputs.image }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes \
              "$EC2_USER@$EC2_HOST" 'bash -s' <<EOF
          set -euo pipefail

          # cd, not just a existence test: an empty or wrong EC2_DEPLOY_PATH
          # would otherwise leave us in the SSH login directory silently
          # ("cd \"\"" is a successful no-op in bash).
          cd "$DEPLOY_PATH" || { echo "ERROR: cannot cd to the deploy path." >&2; exit 1; }

          if [ ! -f .env ]; then
            # The path is masked in the log because it is a secret, which makes
            # a bare failure impossible to diagnose. Dump where we actually
            # landed and where .env really lives — neither is masked.
            echo "ERROR: .env is missing in the deploy path." >&2
            echo "--- landed in ---" >&2
            pwd >&2
            echo "--- contents ---" >&2
            ls -la >&2
            echo "--- .env files under /home/ubuntu ---" >&2
            find /home/ubuntu -maxdepth 4 -name .env -not -path '*/node_modules/*' 2>/dev/null >&2
            echo "Set EC2_DEPLOY_PATH to the directory listed above." >&2
            exit 1
          fi

          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

          export DOCKER_IMAGE="$IMAGE:latest"

          # The prod overlay binds the app to 127.0.0.1:8000 and adds
          # --proxy-headers, so nginx on the host owns the public port. That
          # loopback binding is what makes --forwarded-allow-ips "*" safe: the
          # only client that can reach uvicorn is nginx on this machine.
          #
          # --no-build because the base file still carries a build: section and
          # DEPLOY_PATH has no Dockerfile — without it a failed pull silently
          # degrades into an attempted build instead of failing.
          COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml"

          \$COMPOSE pull app
          \$COMPOSE up -d --no-build
          docker image prune -f

          docker logout ghcr.io

          if ! systemctl is-active --quiet nginx; then
            echo "WARNING: host nginx is not running — HTTPS will fail." >&2
            echo "  Run the 'Set up nginx + TLS' workflow, or on the box:" >&2
            echo "  cd $DEPLOY_PATH && EMAIL=you@example.com ./scripts/setup-nginx-tls.sh" >&2
          fi
          EOF

      # Two checks, deliberately separate. This one runs over SSH against
      # loopback, so it isolates "the app is broken" from "nginx/TLS is broken"
      # — and it needs no inbound port open to GitHub's rotating runner IPs.
      - name: Verify the app is healthy on the instance
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes \
              "$EC2_USER@$EC2_HOST" 'bash -s' <<EOF
          set -euo pipefail
          cd "$DEPLOY_PATH"
          COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml"

          for i in \$(seq 1 20); do
            if curl -fsS -m 5 http://127.0.0.1:8000/health | grep -q '"status":"ok"'; then
              echo "Deployed API is healthy."
              # Migrations are the likeliest silent failure: the container can
              # answer /health perfectly well while sitting on a stale schema,
              # so assert head rather than just printing the revision.
              if ! \$COMPOSE exec -T app alembic current 2>/dev/null | grep -q '(head)'; then
                echo "ERROR: alembic is not at head after deploy." >&2
                \$COMPOSE exec -T app alembic current
                exit 1
              fi
              echo "Migrations are at head."
              exit 0
            fi
            echo "waiting for API... (\$i/20)"; sleep 5
          done

          echo "API did not become healthy after deploy." >&2
          \$COMPOSE ps
          \$COMPOSE logs --tail 50 app
          exit 1
          EOF

      # And this one from the outside, which is the only way to catch nginx
      # being down, the cert having expired, or the proxy pointing at a dead
      # port — none of which the loopback check above can see.
      - name: Verify HTTPS from outside
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            if curl -fsS -m 10 "$API_URL/health" | grep -q '"status":"ok"'; then
              echo "HTTPS healthy — HTTP/$(curl -s -o /dev/null -w '%{http_version}' "$API_URL/health")"
              exit 0
            fi
            echo "waiting for HTTPS... ($i/10)"; sleep 5
          done
          echo "::error::API is healthy on the instance but not reachable over HTTPS."
          echo "nginx is probably not running, or TLS was never set up." >&2
          echo "Run the 'Set up nginx + TLS' workflow." >&2
          curl -sS -m 10 -o /dev/null -w 'final attempt: HTTP %{http_code}\n' "$API_URL/health" || true
          exit 1

      - name: Check the certificate is valid and not near expiry
        run: |
          echo | openssl s_client -connect "$API_DOMAIN:443" -servername "$API_DOMAIN" 2>/dev/null \
            | openssl x509 -noout -issuer -subject -dates
          # Renewal is automatic via certbot.timer; this is the canary for the
          # timer having silently stopped. 14 days leaves room to react.
          if ! echo | openssl s_client -connect "$API_DOMAIN:443" -servername "$API_DOMAIN" 2>/dev/null \
               | openssl x509 -noout -checkend 1209600 >/dev/null; then
            echo "::warning::TLS certificate for $API_DOMAIN expires within 14 days."
          fi
