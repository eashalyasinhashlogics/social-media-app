name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  API_URL: https://<your-subdomain>.duckdns.org
  API_DOMAIN: <your-subdomain>.duckdns.org

jobs:
  build-and-test:
    name: Build & smoke-test backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up swap space
        run: |
          sudo fallocate -l 2G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Resolve image name
        id: image
        run: |
          echo "name=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-backend" >> "$GITHUB_OUTPUT"

      - name: Write a throwaway .env for the test stack
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=ci
          POSTGRES_PASSWORD=ci-test-password
          POSTGRES_DB=social_media_ci
          SECRET_KEY=ci-test-secret-key
          DEBUG=False
          EOF

      - name: Build image
        run: docker compose build app

      - name: Start stack
        run: docker compose up -d --wait --wait-timeout 180

      - name: Assert migrations applied cleanly
        run: |
          docker compose exec -T app alembic current
          docker compose exec -T app alembic check

      - name: Assert API responds
        run: |
          curl -fsS http://127.0.0.1:8000/ | grep -q "Welcome to Social Media API"
          curl -fsS http://127.0.0.1:8000/health | grep -q '"status":"ok"'
          curl -fsS -o /dev/null http://127.0.0.1:8000/docs

      - name: Run the backend test suite
        run: |
          docker compose exec -T \
            -e TEST_DATABASE_URL="postgresql://ci:ci-test-password@postgres:5432/social_media_ci_test" \
            app pytest tests/ -v --cov=app

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

      # --- Publish (main branch only) ---

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag & push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="${{ steps.image.outputs.name }}"
          docker tag social-media-api:latest "$IMAGE:${{ github.sha }}"
          docker tag social-media-api:latest "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  deploy:
    name: Deploy to EC2
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ship compose files to the instance
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy "$EC2_USER@$EC2_HOST" \
            "mkdir -p '$DEPLOY_PATH' && rm -rf '$DEPLOY_PATH/scripts' '$DEPLOY_PATH/deploy'"
          scp -r -i ~/.ssh/id_deploy \
            backend/docker-compose.yml backend/docker-compose.prod.yml backend/scripts backend/deploy \
            "$EC2_USER@$EC2_HOST:$DEPLOY_PATH/"
          ssh -i ~/.ssh/id_deploy "$EC2_USER@$EC2_HOST" \
            "chmod +x '$DEPLOY_PATH'/scripts/*.sh"

      - name: Deploy over SSH
        env:
          IMAGE: ${{ needs.build-and-test.outputs.image }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes \
              "$EC2_USER@$EC2_HOST" 'bash -s' <<EOF
          set -euo pipefail
          cd "$DEPLOY_PATH"

          if [ ! -f .env ]; then
            echo "ERROR: $DEPLOY_PATH/.env is missing on the instance." >&2
            exit 1
          fi

          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

          export DOCKER_IMAGE="$IMAGE:latest"
          COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml"

          \$COMPOSE pull app
          \$COMPOSE up -d
          docker image prune -f

          docker logout ghcr.io

          if ! systemctl is-active --quiet nginx; then
            echo "WARNING: host nginx is not running — HTTPS will fail." >&2
          fi
          EOF

      - name: Verify the deployed API is healthy over HTTPS
        run: |
          for i in $(seq 1 20); do
            if curl -fsS -m 5 "$API_URL/health" | grep -q '"status":"ok"'; then
              echo "Deployed API healthy over HTTPS."; exit 0
            fi
            echo "waiting for API... ($i/20)"; sleep 5
          done
          echo "API did not become healthy after deploy." >&2
          exit 1
