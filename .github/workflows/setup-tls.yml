name: Set up nginx + TLS

# Manually triggered, not automatic. Run it once from the Actions tab
# (Actions -> "Set up nginx + TLS" -> "Run workflow") to install nginx and
# certbot on the instance, drop in the site config, and obtain the certificate.
#
# It is NOT folded into the deploy workflow on purpose: `apt-get update` plus
# an nginx/certbot install adds close to a minute to every push, and TLS setup
# is something you do once per instance, not once per commit. The deploy job
# only warns if nginx is missing.
#
# Safe to re-run. Every step is idempotent, and if certbot has already written
# a TLS block the script leaves the live config alone rather than reverting it
# to the pre-TLS template.
#
# Run it with staging: true FIRST. Let's Encrypt allows only 5 failed
# validations per hostname per hour, and the rehearsal costs none of them.

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email for Let's Encrypt expiry notices (use a real one)"
        required: true
        type: string
      staging:
        description: "Rehearse against the staging CA — issues an untrusted cert but costs no rate limit"
        required: false
        type: boolean
        default: false

env:
  API_URL: https://socialappfomo.duckdns.org
  API_DOMAIN: socialappfomo.duckdns.org

jobs:
  setup:
    name: Install nginx and issue the certificate
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ship the nginx config and setup script
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          # Clear these first rather than copying over them: a recursive copy
          # merges, so a file deleted from the repo would linger on the box.
          ssh -i ~/.ssh/id_deploy "$EC2_USER@$EC2_HOST" \
            "mkdir -p '$DEPLOY_PATH' && rm -rf '$DEPLOY_PATH/scripts' '$DEPLOY_PATH/deploy'"
          scp -r -i ~/.ssh/id_deploy backend/scripts backend/deploy \
            "$EC2_USER@$EC2_HOST:$DEPLOY_PATH/"
          # scp does not reliably carry the executable bit across versions.
          ssh -i ~/.ssh/id_deploy "$EC2_USER@$EC2_HOST" \
            "chmod +x '$DEPLOY_PATH'/scripts/*.sh"

      - name: Install nginx, configure the proxy, obtain the certificate
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
          LE_EMAIL: ${{ inputs.email }}
          LE_STAGING: ${{ inputs.staging && '1' || '0' }}
        run: |
          set -euo pipefail
          # Keepalives: apt-get and certbot both go quiet for long stretches,
          # and a silent connection has been dropped mid-run before ("Broken
          # pipe", ssh exit 255) — failing the job even though the certificate
          # had already been issued.
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
              "$EC2_USER@$EC2_HOST" 'bash -s' <<EOF
          set -euo pipefail
          cd "$DEPLOY_PATH"
          chmod +x scripts/*.sh
          EMAIL='$LE_EMAIL' STAGING='$LE_STAGING' DOMAIN='$API_DOMAIN' \
            ./scripts/setup-nginx-tls.sh
          EOF

      - name: Verify HTTPS from outside
        if: ${{ !inputs.staging }}
        run: |
          set -euo pipefail
          curl -fsS -m 10 "$API_URL/health" | grep -q '"status":"ok"'
          echo "HTTP/$(curl -s -o /dev/null -w '%{http_version}' "$API_URL/health") negotiated"
          echo | openssl s_client -connect "$API_DOMAIN:443" -servername "$API_DOMAIN" 2>/dev/null \
            | openssl x509 -noout -issuer -subject -dates
