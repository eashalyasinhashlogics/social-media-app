services:
  postgres:
    image: postgres:16-alpine
    container_name: social-media-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-socialmedia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secretpassword}
      POSTGRES_DB: ${POSTGRES_DB:-social_media_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-socialmedia} -d ${POSTGRES_DB:-social_media_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: social-media-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-socialmedia}:${POSTGRES_PASSWORD:-secretpassword}@postgres:5432/${POSTGRES_DB:-social_media_dev}
      - CORS_ORIGINS=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  postgres_data:
