# nginx site config for the social-app API.
#
# ---------------------------------------------------------------------------
# THIS FILE IS A TEMPLATE, NOT THE LIVE CONFIG.
#
# scripts/setup-nginx-tls.sh copies it ONCE to
# /etc/nginx/sites-available/social-app on the instance. After that, `certbot
# --nginx` REWRITES that copy in place: it adds `listen 443 ssl` and the
# ssl_certificate lines to the server block below, and splits off a new :80
# block that 301s to https. Everything already in the block (headers, gzip,
# limits, locations, proxy settings) carries over to the HTTPS block.
#
# That is why CI never ships this file. Overwriting the live config on each
# deploy would delete certbot's TLS block and silently break HTTPS. Edit here
# only to re-document intent or to rebuild an instance from scratch; to change
# the live config, edit it on the box and run
# `sudo nginx -t && sudo systemctl reload nginx`.
#
# There are deliberately NO ssl_certificate directives here. certbot needs a
# plain :80 block with a matching server_name to find this site and complete
# the ACME challenge, and nginx refuses to start if it references a cert file
# that does not exist yet.
# ---------------------------------------------------------------------------

# Brute-force damping for the credential endpoints. Must sit at http level,
# which is where sites-enabled/* is included from. 10m holds ~160k addresses.
#
# Tuned to be invisible to humans (a few wrong passwords in a row is fine)
# while making credential stuffing impractical. If legitimate users ever see
# 429s — most likely several sharing one mobile-carrier NAT address — raise the
# rate or drop the limit_req line from the location below.
limit_req_zone $binary_remote_addr zone=socialapp_auth:10m rate=20r/m;

# Required to proxy WebSockets. The Connection header must be "upgrade" for an
# upgrade request and "close" otherwise; hardcoding "upgrade" breaks ordinary
# HTTP keep-alive. Also http level, for the same reason as above.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Drop requests arriving with an unknown Host — port scanners hitting the raw
# IP, mostly. setup-nginx-tls.sh removes Ubuntu's stock `default` site, which
# would otherwise collide with this `default_server` and refuse to start.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name socialappfomo.duckdns.org;

    # Don't advertise the exact nginx version in responses and error pages.
    server_tokens off;

    # The app accepts uploads up to 25 MB (MAX_POST_MEDIA_SIZE_BYTES and
    # MAX_ATTACHMENT_SIZE_BYTES in app/services/media_service.py). This must
    # exceed that, or nginx returns a bare 413 before the request reaches the
    # app and the app's own "Maximum size is 25 MB" message never fires. The
    # extra 5m covers multipart form overhead.
    client_max_body_size 30m;

    # Long enough for a slow cold start after a deploy, short enough that a
    # hung worker does not pile up connections. The /ws/chat location below
    # overrides this — a chat socket is idle most of the time by design.
    proxy_read_timeout 120s;

    # --- response headers ---------------------------------------------------
    # certbot moves these into the HTTPS block, which is the only place they
    # mean anything: browsers ignore HSTS delivered over plain HTTP, so having
    # it here before the cert exists is harmless.
    #
    # No `preload`: duckdns.org is a shared parent domain and this hostname is
    # a placeholder until a real domain is registered. Note the 1-year max-age
    # means browsers refuse plain HTTP for this hostname for a year after their
    # last visit — intended, but it does rule out serving it over HTTP again
    # for testing.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Ubuntu's nginx.conf sets `gzip on` globally, but two defaults still leave
    # every response from this API uncompressed, so all four lines are needed:
    #   - gzip_types defaults to text/html only, which excludes JSON;
    #   - gzip_proxied defaults to `off`, meaning nginx will not compress a
    #     response it obtained from a proxied upstream — which is all of them
    #     here. This one is easy to miss: the config looks right and simply has
    #     no effect. Verify with the Content-Encoding header, not by reading.
    # Feed and conversation payloads are the ones that benefit.
    gzip on;
    gzip_proxied any;
    gzip_types application/json;
    gzip_min_length 1024;

    # --- proxy defaults -----------------------------------------------------
    # Set at server level so the locations inherit them. CAREFUL: defining even
    # one proxy_set_header inside a location discards ALL inherited ones, which
    # is why /ws/chat below repeats every one of these.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # uvicorn runs with --proxy-headers and trusts this to decide whether it is
    # serving http or https — without it FastAPI builds http:// URLs on an
    # https:// site (visible first at /docs).
    proxy_set_header X-Forwarded-Proto $scheme;

    # 429 rather than nginx's default 503: this is client rate limiting, not
    # the service being unavailable, and clients retry on it correctly.
    limit_req_status 429;

    # Only login and register are throttled. /api/v1/auth/refresh is
    # deliberately NOT included — the frontend fires it automatically on any
    # 401 (frontend/src/lib/api.ts), so throttling it would log users out under
    # exactly the conditions it exists to handle.
    location ~ ^/api/v1/auth/(login|register)$ {
        limit_req zone=socialapp_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    # Chat WebSocket (app/api/v1/endpoints/chat_ws.py). Without the upgrade
    # headers the handshake fails and the client silently never connects.
    #
    # Every proxy_set_header from the server block is repeated here on purpose:
    # setting Upgrade/Connection inside this location discards the inherited
    # ones, and losing X-Forwarded-Proto would leave uvicorn thinking the
    # connection is plain http.
    location /ws/chat {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A chat socket is idle between messages. The server-level 120s would
        # drop it mid-conversation and the client would reconnect in a loop.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        # The app container publishes 8000 on the loopback interface only
        # (see docker-compose.prod.yml), so this is reachable from the host but
        # not from the internet. nginx is the only way in.
        proxy_pass http://127.0.0.1:8000;
    }
}
